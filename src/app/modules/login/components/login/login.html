@if (!user) {
    <div class="d-flex flex-column justify-content-center align-items-center min-vh-100">
        <h2 class="mb-4">WIRT <small class="ms-2"><span class="uppercase">w</span>orld <span class="uppercase">i</span>n <span class="uppercase">r</span>eal <span class="uppercase">t</span>ime</small></h2>
        <input type="text" class="form-control w-20 mb-3" (keyup.enter)="createUser()" [(ngModel)]="newUser" placeholder="Type a username" />
        <button class="btn btn-wirt" [disabled]="newUser.trim().length===0" (click)="createUser()">Login</button>
    </div>
  
} @else {
    <div class="d-flex flex-column justify-content-center align-items-center min-vh-100">
        <h2 class="mb-4">WIRT <small class="ms-2"><span class="uppercase">w</span>orld <span class="uppercase">i</span>n <span class="uppercase">r</span>eal <span class="uppercase">t</span>ime</small></h2>
        <h4><small>Welcome <span class="uppercase">{{user}}</span></small></h4>
        <h6 class="mt-3 fa-bounce">
            @if (redirecting()) {
            <small>[ Starting app... ]</small>
            } @else {
                <small>&nbsp;</small>
            }
        </h6>
    </div>
}
