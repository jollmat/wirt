<div class="map-controls">
   
  <button [ngClass]="{'selected': mapType==='openstreet'}" (click)="changeMapType('openstreet')">
    Street
  </button>
  <button [ngClass]="{'selected': mapType==='esristreets'}" (click)="changeMapType('esristreets')">
    Street (ESRI)
  </button>
  <button [ngClass]="{'selected': mapType==='satellite'}" (click)="changeMapType('satellite')">
    Satellite
  </button>
  <button [ngClass]="{'selected': mapType==='terrain'}" (click)="changeMapType('terrain')">
    Terrain
  </button>
  <button [ngClass]="{'selected': mapType==='topographic'}" (click)="changeMapType('topographic')" >
    Topographic
  </button>
</div>

<div
    class="map-container"
    leaflet
    [leafletOptions]="options"
    [leafletLayers]="markerLayers"
    (leafletMapReady)="onMapReady($event)">
</div>
