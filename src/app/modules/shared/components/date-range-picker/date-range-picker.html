<div class="d-flex align-items-center justify-content-start date-range-picker gap-2">

  <div class="date-field d-flex gap-2 align-items-center">
    <label for="dateFrom">From</label>
    <input
      id="dateFrom"
      class="form-control px-2 py-1"
      type="date"
      [value]="dateFrom()"
      [max]="dateTo()"
      (change)="dateFrom.set($any($event.target).value);realTime.set(false);onDateChange()"
    />
  </div>

  <div class="date-field d-flex gap-2 align-items-center">
    <label for="dateTo">To</label>
    <input
      id="dateTo"
      class="form-control px-2 py-1"
      type="date"
      [value]="dateTo()"
      [min]="dateFrom()"
      [max]="momentToday"
      (change)="dateTo.set($any($event.target).value);realTime.set(false);onDateChange()"
    />
  </div>

  <div class="date-presets d-flex ms-2 gap-1">
    <button type="button" class="btn btn-wirt btn-sm" (click)="setRealTime()" [ngClass]="{'active': realTime()}">Real Time</button>
    <button type="button" class="btn btn-wirt btn-sm" (click)="setToday()" [ngClass]="{'active': isToday && !realTime()}">Today</button>
    <button type="button" class="btn btn-wirt btn-sm" (click)="setYesterday()" [ngClass]="{'active': isYesterday}">Yesterday</button>
    <button type="button" class="btn btn-wirt btn-sm" (click)="setLast7Days()" [ngClass]="{'active': isLast7Days}">Last Week</button>
    <button type="button" class="btn btn-wirt btn-sm" (click)="setLastMonth()" [ngClass]="{'active': isLastMonth}">Last Month</button>
  </div>

</div>
